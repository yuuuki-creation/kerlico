[workspace]
members = ["apps/kerlico", "crates/*"]
default-members = ["apps/kerlico"]
exclude = [
    "third_party/ml-kem-legacy",
    "third_party/h3",
    "crates/protocol-shadowquic/vendor/quinn-jls",
    "crates/protocol-shadowquic/vendor/quinn-proto-jls",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
kerlico-core = { path = "crates/core-api" }
kerlico-config = { path = "crates/config" }
kerlico-net = { path = "crates/net" }
kerlico-engine = { path = "crates/engine" }
kerlico-vless = { path = "crates/protocol-vless" }
kerlico-egress = { path = "crates/egress" }
kerlico-anytls = { path = "crates/protocol-anytls" }
kerlico-ss2022 = { path = "crates/protocol-ss2022" }
kerlico-socks = { path = "crates/protocol-socks" }
kerlico-shadowsocks = { path = "crates/protocol-shadowsocks" }
kerlico-trojan = { path = "crates/protocol-trojan" }
kerlico-vmess = { path = "crates/protocol-vmess" }
kerlico-http = { path = "crates/protocol-http" }
kerlico-snell = { path = "crates/protocol-snell" }
kerlico-tuic = { path = "crates/protocol-tuic" }
kerlico-hysteria2 = { path = "crates/protocol-hysteria2" }
kerlico-ssh = { path = "crates/protocol-ssh" }
kerlico-shadowquic = { path = "crates/protocol-shadowquic" }
kerlico-hysteria1 = { path = "crates/protocol-hysteria1" }
kerlico-shadowsocksr = { path = "crates/protocol-shadowsocksr" }
kerlico-shadowtls = { path = "crates/protocol-shadowtls" }
kerlico-mieru = { path = "crates/protocol-mieru" }
kerlico-gost-relay = { path = "crates/protocol-gost-relay" }
kerlico-trusttunnel = { path = "crates/protocol-trusttunnel" }
kerlico-naive = { path = "crates/protocol-naive" }
kerlico-sudoku = { path = "crates/protocol-sudoku" }
tokio = { version = "1", features = ["io-util", "net", "fs", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = "1"
idna = "1"
prost = "0.14"
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
clap = { version = "4", features = ["derive"] }
rcgen = "0.14"
tempfile = "3"
xray-transport = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
xray-proxy = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
xray-routing = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
xray-vless-encryption = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
base64 = "0.23"
rand = "0.8"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
rust-xhttp = { git = "https://github.com/jacek4yang/rust-xhttp", rev = "8de99be3ed1b9446a23763d1b6c36976177eb124" }
rust-reality = { git = "https://github.com/jacek4yang/rust-reality", rev = "316003c5ad2ce9b443f0e9c4311478b7f7b61f9c" }
bytes = "1"
http = "1"
hyper = {version="1",features=["server","http1","http2"]}
hyper-util = {version="0.1",features=["server-auto","server","http1","http2","tokio"]}
http-body-util = "0.1"
tokio-stream = "0.1"
tokio-tungstenite = {version="0.28",default-features=false,features=["handshake"]}
futures-util = {version="0.3",features=["sink"]}
quinn = {version="=0.11.9",default-features=false,features=["runtime-tokio","rustls-ring"]}
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
reqwest = {version="0.12",default-features=false,features=["rustls-tls","json"]}
regex = "1"
hmac = "0.12"
time = {version="0.3",features=["formatting","macros"]}
quick-xml = {version="0.38",features=["serialize"]}
crc32fast = "1"

[patch.crates-io]
ml-kem = { path = "third_party/ml-kem-legacy" }
h3 = { path = "third_party/h3" }
rustls = { git = "https://github.com/aimalygin/shaped-rustls", rev = "3a131beaef0183b0cb61e5a9070a703b6be39ed3" }
quinn = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
quinn-proto = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
h3-quinn = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
blake3 = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
