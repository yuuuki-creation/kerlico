[workspace]
members = ["apps/kerlico", "crates/*"]
default-members = ["apps/kerlico"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
kerlico-core = { path = "crates/core-api" }
kerlico-config = { path = "crates/config" }
kerlico-net = { path = "crates/net" }
kerlico-engine = { path = "crates/engine" }
kerlico-vless = { path = "crates/protocol-vless" }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = "1"
idna = "1"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
clap = { version = "4", features = ["derive"] }
rcgen = "0.14"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
