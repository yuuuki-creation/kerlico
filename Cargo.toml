[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/client",
    "crates/server",
    "crates/outbound",
    "crates/manifest",
    "crates/wg",
]
default-members = ["crates/client", "crates/server"]

[patch.crates-io]
h3-quinn = { path = "vendor/h3-quinn" }
quinn = { path = "vendor/quinn" }
quinn-proto = { path = "vendor/quinn-proto" }
rama-boring = { path = "vendor/rama-boring" }
rama-boring-sys = { path = "vendor/rama-boring-sys" }
