# Rust translation of parts of ZeroTierOne 1.16.2 node/. See UPSTREAM.md.

[package]
name = "zerotier-node"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Sans-IO ZeroTier VL1/VL2 client node translated from ZeroTierOne 1.16.2 node/"

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "2.2"
x25519-dalek = "2"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
poly1305 = "0.8"
rand = "0.8"
salsa20 = "0.11"
sha2 = "0.10"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
