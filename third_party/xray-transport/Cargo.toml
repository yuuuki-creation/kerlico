[package]
name = "xray-transport"
version = "0.8.1"
edition = "2021"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/aimalygin/xray-rust"
publish = false
description = "TCP, TLS, REALITY, DNS, and dialing transports for xray-rust"

[dependencies]
# Direct RustCrypto deps enable zeroize feature unification for AES-GCM internal state.
aes = { version = "0.9", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
async-compression = { version = "=0.4.42", default-features = false, features = ["gzip", "tokio"] }
async-trait = "0.1"
blake2 = "=0.11.0"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ghash = { version = "0.6", features = ["zeroize"] }
h2 = "0.4.16"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
hkdf = "0.13"
hmac = "0.13"
http = "1"
idna = "1"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
polyval = { version = "0.7", features = ["zeroize"] }
rand = "0.8"
regex = "1"
quinn = { version = "=0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "brotli", "logging", "ring", "std", "tls12", "zlib"] }
sha1 = "0.11"
sha2 = "0.11"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "logging", "ring", "tls12"] }
webpki-roots = "1.0.11"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
x509-parser = { version = "0.18", default-features = false }
xray-routing = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
xray-proxy = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
xray-utls = { git = "https://github.com/aimalygin/xray-rust", rev = "9b06d37466492242a1827f9a16aa91ca4c1b00be" }
zeroize = "1"
zstd = { version = "0.14.3", default-features = false }

[dev-dependencies]
base64 = "0.23.1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["test-util", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
tracing = "0.1"
