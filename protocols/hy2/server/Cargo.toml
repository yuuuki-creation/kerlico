[package]
name = "kerlico-hy2-server"
version = "0.1.0"
edition = "2021"

[dependencies]
kerlico-shared = { path = "../../../crates/shared" }
kerlico-hy2 = { path = "../shared" }
kerlico-tls = { path = "../../../crates/tls", features = ["quic"] }
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
serde_json = "1"
