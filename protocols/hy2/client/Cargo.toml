[package]
name = "kerlico-hy2-client"
version = "0.1.0"
edition = "2021"

[dependencies]
kerlico-shared = { path = "../../../crates/shared" }
kerlico-hy2 = { path = "../shared" }
kerlico-outbound = { path = "../../../crates/outbound" }
kerlico-tls = { path = "../../../crates/tls", features = ["quic"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
