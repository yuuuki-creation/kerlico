[package]
name = "kerlico-anytls"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
blake3 = "1"
kerlico-tls = { path = "../../../crates/tls" }
md-5 = "0.10"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-jls = { version = "=1.3.7", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
