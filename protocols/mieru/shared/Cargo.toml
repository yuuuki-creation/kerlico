[package]
name = "kerlico-mieru"
version = "0.1.0"
edition = "2021"

[dependencies]
chacha20 = "0.9"
getrandom = "0.2"
kerlico-shared = { path = "../../../crates/shared" }
pbkdf2 = "0.12"
ring = "0.17"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
socket2 = "0.6"

[dev-dependencies]
chacha20poly1305 = "0.10"
