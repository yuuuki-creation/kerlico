[package]
name = "kerlico-vless"
version = "0.1.0"
edition = "2021"

[dependencies]
pkcs8 = { version = "0.10", features = ["std"] }
kerlico-shared = { path = "../../../crates/shared" }
der = { version = "0.7", features = ["std"] }
x509-cert = { version = "0.2.5", features = ["std"] }
x509-ocsp = { version = "0.2.1", features = ["std"] }
data-encoding = "2"
hickory-proto = { version = "0.25", default-features = false }
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
natpmp = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
ring = "0.17"
boring2 = { package = "rama-boring", version = "=0.7.0" }
boring-sys = { package = "rama-boring-sys", version = "=0.7.0" }
brotli = "8"
flate2 = "1"
zstd = "0.13"
rustls-native-certs = "0.8"
sha3 = "0.10"
mlua = { version = "0.11.6", features = ["lua51", "vendored", "send"] }
num-bigint-dig = { version = "0.9", features = ["prime"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
subtle = "2"
blake2 = "0.10"
rand = "0.10"
base64 = "0.22"
percent-encoding = "2"
crc32fast = "1"
http-body-util = "0.1"
httpdate = "1"
mime_guess = "2"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
quick-xml = { version = "0.38", features = ["serialize"] }
regex = "1"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "net", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
aes-gcm = "0.10"
cipher = "0.4"
ctr = "0.9"
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
hmac = "0.12"
hkdf = "0.12"
hpack = "0.3"
sha2 = "0.10"
ml-kem = { version = "0.2", features = ["deterministic"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
sha1 = "0.10"
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", features = ["net", "socket", "uio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
