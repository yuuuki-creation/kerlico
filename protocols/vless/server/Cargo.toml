[package]
name = "kerlico-vless-server"
version = "0.1.0"
edition = "2021"

[dependencies]
kerlico-shared = { path = "../../../crates/shared" }
kerlico-vless = { path = "../shared" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util"] }

[dev-dependencies]
rcgen = "0.13"
socket2 = { version = "0.6", features = ["all"] }
