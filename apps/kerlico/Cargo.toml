[package]
name = "kerlico"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = [
    "protocol-vless",
    "protocol-anytls",
    "protocol-ss2022",
    "protocol-socks",
    "protocol-shadowsocks",
    "protocol-trojan",
    "protocol-vmess",
    "protocol-http",
    "protocol-snell",
    "protocol-tuic",
    "protocol-hysteria2",
    "protocol-ssh",
    "protocol-shadowquic",
    "protocol-hysteria1",
    "protocol-shadowsocksr",
    "protocol-shadowtls",
    "protocol-mieru",
    "protocol-gost-relay",
    "protocol-trusttunnel",
    "protocol-naive",
    "protocol-sudoku",
    "protocol-tor",
    "protocol-wireguard",
    "protocol-masque",
    "protocol-openvpn",
    "protocol-openconnect",
    "protocol-tailscale",
    "protocol-tun",
    "protocol-easytier",
    "warp",
]
warp = ["dep:kerlico-device"]
protocol-tun = ["dep:kerlico-tun"]
protocol-easytier = ["dep:kerlico-easytier"]
protocol-vless = ["dep:kerlico-vless"]
