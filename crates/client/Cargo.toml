[package]
name = "kerlico-client"
version = "0.1.0"
edition = "2021"

[dependencies]
kerlico-shared = { path = "../shared" }
wireguard = { package = "kerlico-wireguard-client", path = "../../protocols/wireguard/client", optional = true }
openvpn = { package = "kerlico-openvpn-client", path = "../../protocols/openvpn/client", optional = true }
mieru = { package = "kerlico-mieru-client", path = "../../protocols/mieru/client", optional = true }
vless = { package = "kerlico-vless-client", path = "../../protocols/vless/client", optional = true }
httparse = "1"
if-addrs = "0.13"
socket2 = "0.5"

[build-dependencies]
kerlico-manifest = { path = "../manifest" }
