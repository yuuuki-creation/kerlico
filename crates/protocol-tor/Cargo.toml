[package]
name = "kerlico-tor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kerlico-core.workspace = true
kerlico-config.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
rustls.workspace = true
futures = "=0.3.34"
async-trait = "=0.1.92"
arti-client = { path = "vendor/arti-client", version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "onion-service-client", "vanguards"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tor-general-addr = "=0.47.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
arti-client = { path = "vendor/arti-client", version = "=0.47.0", default-features = false, features = ["experimental-api", "error_detail"] }
tor-circmgr = { version = "=0.47.0", default-features = false }
tor-config = { version = "=0.47.0", default-features = false }
tor-dirmgr = { version = "=0.47.0", default-features = false }
tor-netdir = { version = "=0.47.0", default-features = false }
tor-netdoc = { version = "=0.47.0", default-features = false }

[lints]
workspace = true
