[package]
name = "kerlico-egress"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kerlico-core.workspace = true
kerlico-config.workspace = true
kerlico-net.workspace = true
kerlico-routing.workspace = true
kerlico-dns.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
flate2 = "1"
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["process"] }

[features]
test-support = []

[dev-dependencies]
kerlico-egress = { path = ".", features = ["test-support"] }
kerlico-shadowsocks.workspace = true
kerlico-ss2022.workspace = true
base64.workspace = true
tempfile = "3"

[lints]
workspace = true
