[package]
name = "kerlico-wg"
version = "0.1.0"
edition = "2021"

[features]
tun-device = ["dep:libc", "dep:socket2", "dep:tokio", "dep:tun", "dep:tun-rs", "dep:io-uring", "dep:futures-util", "dep:bytes", "dep:tokio-util", "dep:windows-sys", "dep:wintun-bindings"]

[[bin]]
name = "kerlico-wg"
path = "src/main.rs"
required-features = ["tun-device"]

[dependencies]
base64 = "0.22"
boringtun = "0.7.1"
ipnet = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic"] }
tempfile = "3"
socket2 = { version = "0.6", features = ["all"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"], optional = true }
x25519-dalek = { version = "2", features = ["static_secrets", "reusable_secrets"] }

[target.'cfg(not(windows))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
tun = { version = "0.7.13", features = ["async"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "=0.7.16", optional = true }
tun-rs = { version = "=2.8.18", default-features = false, features = ["async_tokio", "async_framed"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
bytes = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
tokio-util = { version = "0.7", features = ["compat"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization"], optional = true }
wintun-bindings = { version = "0.7.40", features = ["async"], optional = true }
